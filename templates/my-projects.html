{% extends  "base.html"%}

{% block title %}My Project{% endblock %}

{%block content%}
    <h1 class="projects_h1">{{username}} projects</h1>
    <div class="git-hub-conexion">
       <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
       </svg>

       <a href=""><h4 >Connect your GitHub account</h4></a>
    </div>

    <div class="projects" id="projects-container">
        <div id="adder" class="project addprojects">
            <p>+</p>
        </div>
    </div>

    <div  id="pop-up-project" class="pop-up-project">
        <div id="close-btn">x</div>
         <h1>Configure su proyecto</h1>
        <form action="/my-projects" method="post" id="form">
           <label for="name-project">Project Name</label>
           <input type="text" name="name-project" id="name-project" required>
           <label for="project-password" id="project-password">Password Project (optional) </label>
           <input type="checkbox" id="pass-lock" name="pass-lock"><label for="pass-lock">Add Project Pass?</label>
           <div class="pass-wrapper">
            <input type="password" id="pass_project" name="pass_project" disabled >
           <span id="toogle-password">👁</span>
           </div>
           
           
           <button type="submit" class="adder" id="adder_project" name="action" value="addProject" >Add Project</button>
        </form>
    </div>

    <div class="delete-project" style="display: hide;" id="delete-project">
        
    <h3>
        Are you sure to delete this project?
    </h3>
       
        <button type="button" id="delete-btn">Yes</button><button type="button" id="no-delete">No</button>

    </div>

    <div class="security-project" id="security-project">
        <div class="close-security" id="close-security">x</div>
        <form action="" method="post">
            <label for="pass-security">Enter the pass por delete private project:</label>
            <input type="password" name="pass-security" id="pass-security">
            <button type="button" id="def_del">Delete</button>
        </form>
    </div>
<script>
    const popup_project = document.getElementById('pop-up-project');
    const adder = document.getElementById('adder');
    const closeBtn_in_adder = document.getElementById('close-btn'); 
    const pass_lock = document.getElementById('pass-lock');
    const password_project = document.getElementById('pass_project');
    const toogle_password = document.getElementById('toogle-password');
    const adder_project = document.getElementById('adder_project');
    const projects_container = document.getElementById('projects-container');
    const name_project = document.getElementById('name-project');
    const form = document.getElementById('form');
    const delete_popup = document.getElementById('delete-project');
    const delete_btn = document.getElementById('delete-btn');
    const no_delete = document.getElementById('no-delete');
    const security_project = document.getElementById('security-project');
    const close_security = document.getElementById('close-security');
    const def_del = document.getElementById('def_del');
    const user_projects = {{ projects | tojson }};
    const pass_security = document.getElementById('pass-security');
    user_projects.forEach(proj => {
        createProjectElement(proj.name, proj.has_password, proj.id);
    });

    function createProjectElement(name, hasPassword, id) {
        const project = document.createElement('div');
        const del_project = document.createElement('div');
        const title = document.createElement('div');
        title.innerText=name;
        project.appendChild(title);
        del_project.className="delete_project";
        project.className="project";
        

        project.appendChild(del_project);
        del_project.innerHTML+="<svg xmlns='http://www.w3.org/2000/svg' x='0px' y='0px' width='100' height='100' viewBox='0,0,256,256'><g fill='#ffffff' fill-rule='nonzero' stroke='none' stroke-width='1' stroke-linecap='butt' stroke-linejoin='miter' stroke-miterlimit='10' stroke-dasharray='' stroke-dashoffset='0' font-family='none' font-weight='none' font-size='none' text-anchor='none' style='mix-blend-mode: normal'><g transform='scale(8.53333,8.53333)''><path d='M14.98438,2.48633c-0.55152,0.00862 -0.99193,0.46214 -0.98437,1.01367v0.5h-5.5c-0.26757,-0.00363 -0.52543,0.10012 -0.71593,0.28805c-0.1905,0.18793 -0.29774,0.44436 -0.29774,0.71195h-1.48633c-0.36064,-0.0051 -0.69608,0.18438 -0.87789,0.49587c-0.18181,0.3115 -0.18181,0.69676 0,1.00825c0.18181,0.3115 0.51725,0.50097 0.87789,0.49587h18c0.36064,0.0051 0.69608,-0.18438 0.87789,-0.49587c0.18181,-0.3115 0.18181,-0.69676 0,-1.00825c-0.18181,-0.3115 -0.51725,-0.50097 -0.87789,-0.49587h-1.48633c0,-0.26759 -0.10724,-0.52403 -0.29774,-0.71195c-0.1905,-0.18793 -0.44836,-0.29168 -0.71593,-0.28805h-5.5v-0.5c0.0037,-0.2703 -0.10218,-0.53059 -0.29351,-0.72155c-0.19133,-0.19097 -0.45182,-0.29634 -0.72212,-0.29212zM6,9l1.79297,15.23438c0.118,1.007 0.97037,1.76563 1.98438,1.76563h10.44531c1.014,0 1.86538,-0.75862 1.98438,-1.76562l1.79297,-15.23437z'></path></g></g></svg>";
        if (hasPassword){
            title.innerText+= "🔒";
        }
        projects_container.appendChild(project);

        project.addEventListener("click",()=>{
            window.location.href=`/projects/${id}`;
        });

        del_project.addEventListener("click", (e)=>{
            e.stopPropagation();

            delete_popup.style.display="flex";
            delete_btn.addEventListener("click",async ()=>{
                if(hasPassword){
                    security_project.style.display="block";

                    
                    close_security.addEventListener("click",()=>{
                        security_project.style.display="none";
                    });

                    def_del.addEventListener("click", async( ) =>{
                        const response = await fetch(`/projects/${id}/private/delete`,{
                            method:"POST",
                            headers:{
                                "Content-Type":"application/json"
                            },
                            body: JSON.stringify({
                                "password":pass_security.value}
                            )
                        }); 
                        const data_response = await response.json();

                        if(data_response.success){
                            
                            const response = await fetch(`/projects/${id}/delete`,{
                                method:"DELETE",
                                headers:{
                                    "Content-Type":"application/json"
                                },
                            });
                            const data = await response.json();

                            if(data.success){
                                project.remove();
                                delete_popup.style.display="none";
                               security_project.style.display="none";
                            }
                            else{
                                alert("No se pudo borrar");
                            }
                            

                        }
                        else{
                            alert("Incorrect password");
                        }
                    });
                }
                else{
                    const response = await fetch(`/projects/${id}/delete`,{
                method:"DELETE",
                headers:{
                    "Content-Type":"application/json"
                },
               
            });

                const data = await response.json();

                if(data.success){
                    project.remove();
                    delete_popup.style.display="none";
                }
                else{
                    alert("No se pudo borrar");
                }
                }


                
                });
            no_delete.addEventListener("click",()=>{
                delete_popup.style.display="none";
            });
            
        });
    }



    adder_project.addEventListener("click", (e) => {
        e.preventDefault();

        const NewName = name_project.value;
        const hasPass = pass_lock.checked;

        if(NewName){
            createProjectElement(NewName, hasPass);
            popup_project.style.display = "none";
            
        }
        form.submit();
        name_project.value="";
        
    });

    toogle_password.addEventListener("click", ()=>{
        if (password_project.type == "password"){
            password_project.type = "text";
        }
        else{
            password_project.type = "password";
        }
    });

    adder.addEventListener("click", () =>{
        popup_project.style.display = "block";
        
        pass_lock.checked = false;
        password_project.setAttribute("disabled", true);
       
        
    });

    closeBtn_in_adder.addEventListener("click", ()=> {
            popup_project.style.display="none";
           
    });

    pass_lock.addEventListener("change",()=>{
        if (pass_lock.checked){
             password_project.removeAttribute('disabled');
        }
        else{
             password_project.setAttribute("disabled", true);
        }
           

    });
</script>


{%endblock%}
