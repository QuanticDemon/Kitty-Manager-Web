<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{%if project[1] != None%}{{project[0]}}  🔒 {%else%}{{project[0]}}{%endif%}</title>
    <style>
      body{
        background:magenta;
      }

      #files-container{
        width: 90%;
        padding:18px;
        display:grid;
        grid-template:auto auto auto;
        gap:10px;
      }
      
      .file{
        background:white;
        width:150px;
        height:10vh;
        display:flex;
        justify-content:center;
        text-align:center;
        position:relative;
         
      }

      .file::before {
         content: "";
         position: absolute;
         top: 0;
         right: 0;
         width: 0;
         height: 0;
         border-width: 0 35px 35px 0;
         border-style: solid;
         border-color:#fdfdfd rgba(38, 40, 59, 0.2); 
         box-shadow: -2px 2px 5px rgba(0, 0, 0, 0.2);
        }

  
        
        
      .file p{
       position:absolute;
       top:50%;
       left:50%;
       transform:translate(-50%, -50%);
      }
      #pop-up-files{
        display:none;
        background:rgba(226, 223, 223, 1);
        width:90%;
        height:50vh;
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        
        
      }

      #close-popup-files{
        width:30px;
        height:30px;
        background:red;
        color:white;
        text-align:center;
        display:flex;
        justify-content:center;
        padding:15px;
        border-radius:50%;
        margin:10px 10px 20px 10px;
        font-size:18px;
        position:relative;
      }
      #close-popup-files p{
        text-align:center;
        position:absolute;
        top:50%;
        left:50%;
        transform: translate(-50%,-50%);
        font-weight:bolder;
      }
      #type-files{
        display:grid;
        grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
        gap:10px;
        padding:20px;  
      }

      #type-files .file{
        border:2px solid black;
      }


    </style>
</head>
<body>
  <div id="files-container">
   
    <div id="add-file" class="file">
    <div id="file-content">
      <p>+</p>
    </div>
   </div> 
  </div>
  <div id="pop-up-files">
     <div id="close-popup-files">
      <p>x</p>
     </div>
     <div id="type-files">
       <div class="file html-file" id="html-file">
          <img src="../static/images/htmlicon.png" alt="html">
       </div>
       <div class="file css-file">
          <img src="" alt="css">
       </div>
       <div class="file python-file">
          <img src="" alt="python">
       </div>

     </div>
  </div>

  <div id="file-settings-html" style="display:none;">
    <div class="title">
      <h4>Configure su archivo html</h4>
    </div>
    <div id="form-html" >
      <form method="post">
        <label for="file-name">File name</label>
        <input type="text" id="file-name" placeholder="example">

   <input type="checkbox" id="custom"><label for="custom">Desea añadir configuracion adicional?</label>
      <div style="display:none;"  id="customizing-html">
      <div id="html-structures">
          <div id="structure">
            <img src="" alt="Dinamic Form">
          </div>
        </div>
      </div>

      </form>
    </div>
  </div>

  <script>
    const add_file = document.getElementById("add-file");
    const pop_up_files = document.getElementById("pop-up-files");
    const close_popup_files = document.getElementById("close-popup-files");
    
    add_file.addEventListener("click", ()=>{
       pop_up_files.style.display="grid";
      const user_file = document.createElement('div');
      user_file.className="file";
      

    });

    close_popup_files.addEventListener("click", ()=>{
      pop_up_files.style.display="none";
    });

    function file_customization(){
       const html_file = document.getElementById('html-file');

      html_file.addEventListener("click", ()=>{
        const html_settings = document.getElementById('file-settings-html');
        const custom_check = document.getElementById('custom');
        const customizing_html=document.getElementById('customizing-html');
        html_settings.style.display="block";

        if(custom_check.checked){
          customizing_html.style.display="block";
        }

      });
    }
  </script>
</body>
</html>
